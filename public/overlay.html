<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Overlay Kuis Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #F4F0FF;
    --ink-dim: #B9AEDE;
    --bg-deep: #170F2E;
    --bg-panel: #241748;
    --pink: #FF2E76;
    --yellow: #FFCB3C;
    --cyan: #3FE3D0;
    --wrong-dim: #2E2456;
    --radius: 22px;
    --font-display: 'Fredoka', sans-serif;
    --font-body: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: var(--font-body);
    color: var(--ink);
    overflow: hidden;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 48px 40px;
    gap: 28px;
  }

  /* ---------- Question header ---------- */
  .q-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--ink-dim);
    font-size: 22px;
    font-weight: 600;
  }
  .q-meta .chip {
    background: var(--bg-panel);
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    padding: 6px 18px;
  }
  .q-meta .chip.category { color: var(--cyan); }

  .question-card {
    width: 100%;
    max-width: 880px;
    background: linear-gradient(160deg, var(--bg-panel), #1D1240);
    border-radius: var(--radius);
    padding: 36px 40px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.35);
    text-align: center;
  }
  .question-card h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 44px;
    line-height: 1.25;
    margin: 0;
  }

  /* ---------- Timer ---------- */
  .timer-track {
    width: 100%;
    max-width: 880px;
    height: 14px;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    overflow: hidden;
  }
  .timer-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, var(--cyan), var(--pink));
    transform-origin: left;
    transition: transform linear;
  }

  /* ---------- Options ---------- */
  .options {
    width: 100%;
    max-width: 880px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--bg-panel);
    border-radius: 18px;
    padding: 22px 24px;
    border: 3px solid rgba(255,255,255,0.06);
    transition: border-color 0.3s, background 0.3s, opacity 0.3s, transform 0.3s;
  }
  .option .letter {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 700;
    width: 44px;
    height: 44px;
    flex: none;
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .option .text {
    font-size: 24px;
    font-weight: 500;
    line-height: 1.3;
  }
  .option.correct {
    border-color: var(--yellow);
    background: linear-gradient(160deg, #4A3A12, var(--bg-panel));
    transform: scale(1.02);
  }
  .option.correct .letter { background: var(--yellow); color: #211407; }
  .option.dim { opacity: 0.35; }

  /* ---------- Winner banner ---------- */
  .winner-banner {
    max-width: 880px;
    width: 100%;
    background: linear-gradient(120deg, var(--pink), #FF7A45);
    border-radius: 18px;
    padding: 18px 28px;
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 600;
    text-align: center;
    box-shadow: 0 10px 30px rgba(255,46,118,0.35);
  }
  .winner-banner.none {
    background: var(--bg-panel);
    color: var(--ink-dim);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 20px;
    box-shadow: none;
  }

  /* ---------- Leaderboard takeover ---------- */
  #leaderboard {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 20%, #2B1A57, var(--bg-deep) 70%);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    padding: 60px 40px;
  }
  #leaderboard.show { display: flex; }
  #leaderboard h2 {
    font-family: var(--font-display);
    font-size: 40px;
    margin: 0;
  }
  #leaderboard .list {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #leaderboard .row {
    display: flex;
    align-items: center;
    gap: 18px;
    background: var(--bg-panel);
    border-radius: 16px;
    padding: 12px 22px;
  }
  #leaderboard .row .rank {
    font-family: var(--font-display);
    font-size: 26px;
    width: 40px;
    color: var(--ink-dim);
  }
  #leaderboard .row:nth-child(1) .rank { color: var(--yellow); }
  #leaderboard .row .name {
    flex: 1;
    font-size: 24px;
    font-weight: 600;
  }
  #leaderboard .row .score {
    font-family: var(--font-display);
    font-size: 24px;
    color: var(--cyan);
  }

  /* ---------- Thank-you card (follow / gift) ---------- */
  #thanks {
    position: absolute;
    bottom: 36px;
    left: 50%;
    width: calc(100% - 80px);
    max-width: 820px;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 20px 28px;
    border-radius: 22px;
    background: linear-gradient(120deg, #3A1450, var(--bg-panel));
    border: 3px solid var(--pink);
    box-shadow: 0 14px 40px rgba(255,46,118,0.35);
    transform: translate(-50%, 140%);
    opacity: 0;
    transition: transform 0.45s cubic-bezier(.2,1.4,.4,1), opacity 0.3s;
    pointer-events: none;
  }
  #thanks.show { transform: translate(-50%, 0); opacity: 1; }
  #thanks.gift {
    border-color: var(--yellow);
    background: linear-gradient(120deg, #4A3A12, var(--bg-panel));
    box-shadow: 0 14px 40px rgba(255,203,60,0.35);
  }
  #thanks .icon {
    flex: none;
    width: 84px;
    height: 84px;
    border-radius: 18px;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
  }
  #thanks .icon img { width: 72px; height: 72px; object-fit: contain; }
  #thanks .body { min-width: 0; }
  #thanks .title {
    font-family: var(--font-display);
    font-size: 34px;
    font-weight: 700;
    line-height: 1.1;
  }
  #thanks.follow .title { color: var(--pink); }
  #thanks.gift .title { color: var(--yellow); }
  #thanks .line {
    margin-top: 6px;
    font-size: 24px;
    font-weight: 600;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }

  /* ---------- Toasts ---------- */
  #toasts {
    position: absolute;
    bottom: 200px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    pointer-events: none;
  }
  .toast {
    max-width: 820px;
    background: var(--bg-panel);
    border: 2px solid var(--cyan);
    border-radius: 14px;
    padding: 14px 22px;
    font-size: 20px;
    font-weight: 600;
    text-align: center;
    animation: toast-in 0.25s ease-out, toast-out 0.4s ease-in 4.6s forwards;
  }
  .toast.follow { border-color: var(--pink); }
  .toast.winner {
    border-color: var(--yellow);
    background: linear-gradient(160deg, #4A3A12, var(--bg-panel));
    font-size: 24px;
  }

  .winner-banner.pop { animation: banner-pop 0.5s ease-out; }
  @keyframes banner-pop {
    0% { transform: scale(0.85); opacity: 0; }
    60% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); }
  }

  /* ---------- Timer / answer chips ---------- */
  .q-meta .chip.timer {
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    min-width: 96px;
    text-align: center;
    transition: color 0.2s, border-color 0.2s;
  }
  .q-meta .chip.timer.urgent {
    color: var(--pink);
    border-color: var(--pink);
    animation: tick-pulse 1s ease-out infinite;
  }
  .q-meta .chip.answers { color: var(--yellow); font-variant-numeric: tabular-nums; }
  .q-meta .chip.answers.bump { animation: bump 0.3s ease-out; }
  .timer-track.urgent .timer-fill { animation: urgent-flash 0.5s ease-in-out infinite alternate; }

  /* ---------- Entrances & reveal motion ---------- */
  .question-card.enter { animation: card-in 0.6s cubic-bezier(.2,1.3,.4,1) both; }
  .option.enter {
    animation: opt-in 0.45s cubic-bezier(.2,1.3,.4,1) both;
    animation-delay: calc(var(--i) * 90ms + 250ms);
  }
  .option.correct {
    animation: correct-pop 0.7s cubic-bezier(.2,1.4,.4,1) both, correct-glow 1.6s ease-in-out 0.7s infinite;
  }
  .option.dim { animation: wrong-shake 0.45s ease-in-out; }
  .winner-banner.hint { animation: hint-bob 2.4s ease-in-out infinite; }

  /* ---------- Answer bubbles ---------- */
  .answer-feed {
    position: relative;
    width: 100%;
    max-width: 880px;
    height: 280px;
    pointer-events: none;
  }
  .bubble {
    position: absolute;
    bottom: 0;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(36,23,72,0.92);
    border: 2px solid rgba(63,227,208,0.6);
    font-size: 20px;
    font-weight: 600;
    white-space: nowrap;
    animation: bubble-rise 2.6s ease-out forwards;
  }

  /* ---------- Leaderboard motion ---------- */
  #leaderboard.show { animation: fade-in 0.4s ease-out; }
  #leaderboard.show h2 { animation: title-drop 0.6s cubic-bezier(.2,1.4,.4,1) both; }
  #leaderboard.show .row {
    animation: row-in 0.5s cubic-bezier(.2,1.3,.4,1) both;
    animation-delay: calc(var(--i) * 80ms + 250ms);
  }
  #leaderboard .row.top {
    border: 2px solid var(--yellow);
    box-shadow: 0 0 24px rgba(255,203,60,0.35);
  }
  #leaderboard.show .row.top {
    animation: row-in 0.5s cubic-bezier(.2,1.3,.4,1) 250ms both, correct-glow 1.6s ease-in-out 1s infinite;
  }

  /* ---------- Thank-you card motion ---------- */
  #thanks.show .icon { animation: icon-wobble 0.9s ease-in-out 0.3s; }

  /* ---------- Effects layer & sound hint ---------- */
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #soundHint {
    position: absolute;
    top: 12px;
    right: 12px;
    display: none;
    background: var(--bg-panel);
    border: 2px solid var(--yellow);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  #soundHint.show { display: block; }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(-30px) scale(0.9); }
    to { opacity: 1; transform: none; }
  }
  @keyframes opt-in {
    from { opacity: 0; transform: translateY(24px) scale(0.9); }
    to { opacity: 1; transform: none; }
  }
  @keyframes correct-pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.1) rotate(-1.5deg); }
    70% { transform: scale(0.98) rotate(0.5deg); }
    100% { transform: scale(1.02); }
  }
  @keyframes correct-glow {
    0%, 100% { box-shadow: 0 0 0 rgba(255,203,60,0); }
    50% { box-shadow: 0 0 32px rgba(255,203,60,0.55); }
  }
  @keyframes wrong-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  @keyframes hint-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes tick-pulse {
    0% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }
  @keyframes bump {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  @keyframes urgent-flash {
    from { filter: brightness(1); }
    to { filter: brightness(1.6) saturate(1.4); }
  }
  @keyframes bubble-rise {
    0% { transform: translate(-50%, 20px) scale(0.6); opacity: 0; }
    15% { transform: translate(-50%, 0) scale(1.05); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--drift)), -230px) scale(1); opacity: 0; }
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes title-drop {
    from { opacity: 0; transform: translateY(-40px) scale(0.8); }
    to { opacity: 1; transform: none; }
  }
  @keyframes row-in {
    from { opacity: 0; transform: translateX(-60px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes icon-wobble {
    0%, 100% { transform: rotate(0) scale(1); }
    25% { transform: rotate(-14deg) scale(1.15); }
    50% { transform: rotate(10deg) scale(1.1); }
    75% { transform: rotate(-5deg) scale(1.05); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }

  @keyframes toast-in {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes toast-out {
    to { opacity: 0; transform: translateY(-8px); }
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="q-meta">
      <div class="chip" id="qNumber">Q1</div>
      <div class="chip category" id="qCategory">—</div>
      <div class="chip timer" id="qTimer">⏱ —</div>
      <div class="chip answers" id="qAnswers">✋ 0</div>
    </div>

    <div class="question-card" id="questionCard">
      <h1 id="qText">Menunggu pertanyaan berikutnya…</h1>
    </div>

    <div class="timer-track" id="timerTrack"><div class="timer-fill" id="timerFill"></div></div>

    <div class="options" id="options"></div>

    <div class="winner-banner none" id="winnerBanner">Belum ada yang dapat skor — jadilah yang pertama!</div>

    <div class="answer-feed" id="answerFeed"></div>
  </div>

  <div id="leaderboard">
    <h2 id="lbTitle">Papan Peringkat</h2>
    <div class="list" id="lbList"></div>
  </div>

  <div id="toasts"></div>

  <div id="thanks" aria-live="polite">
    <div class="icon" id="thanksIcon"></div>
    <div class="body">
      <div class="title" id="thanksTitle">Terima kasih!</div>
      <div class="line" id="thanksLine"></div>
    </div>
  </div>

  <canvas id="fx"></canvas>
  <div id="soundHint">🔇 Klik untuk menyalakan suara</div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const qNumber = document.getElementById("qNumber");
    const qCategory = document.getElementById("qCategory");
    const qText = document.getElementById("qText");
    const optionsEl = document.getElementById("options");
    const timerFill = document.getElementById("timerFill");
    const winnerBanner = document.getElementById("winnerBanner");
    const leaderboardEl = document.getElementById("leaderboard");
    const lbTitle = document.getElementById("lbTitle");
    const lbList = document.getElementById("lbList");
    const toasts = document.getElementById("toasts");

    const questionCard = document.getElementById("questionCard");
    const qTimer = document.getElementById("qTimer");
    const qAnswers = document.getElementById("qAnswers");
    const timerTrack = document.getElementById("timerTrack");
    const answerFeed = document.getElementById("answerFeed");
    const soundHint = document.getElementById("soundHint");
    const params = new URLSearchParams(location.search);
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    // --- Sound: synthesized with Web Audio, no asset files -----------------
    // ?mute disables it, ?volume=0..1 sets the level (default 0.6).
    const Sfx = (() => {
      const muted = params.has("mute");
      const volume = Math.min(1, Math.max(0, Number(params.get("volume") ?? 0.6) || 0));
      let ctx = null;
      let master = null;

      function ensure() {
        if (muted) return null;
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ctx = new AC();
          master = ctx.createGain();
          master.gain.value = volume;
          master.connect(ctx.destination);
          // A normal browser blocks audio until a click; OBS doesn't.
          const sync = () => soundHint.classList.toggle("show", ctx.state === "suspended");
          ctx.onstatechange = sync;
          sync();
        }
        if (ctx.state === "suspended") ctx.resume().catch(() => {});
        return ctx;
      }

      function tone(freq, start, dur, { type = "sine", gain = 0.2, slideTo, attack = 0.008 } = {}) {
        const c = ensure();
        if (!c) return;
        const t = c.currentTime + start;
        const osc = c.createOscillator();
        const g = c.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(gain, t + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(g).connect(master);
        osc.start(t);
        osc.stop(t + dur + 0.05);
      }

      function noise(start, dur, { gain = 0.15, from = 800, to = 3000, q = 1 } = {}) {
        const c = ensure();
        if (!c) return;
        const t = c.currentTime + start;
        const len = Math.ceil(c.sampleRate * dur);
        const buf = c.createBuffer(1, len, c.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        const src = c.createBufferSource();
        src.buffer = buf;
        const f = c.createBiquadFilter();
        f.type = "bandpass";
        f.Q.value = q;
        f.frequency.setValueAtTime(from, t);
        f.frequency.exponentialRampToValueAtTime(to, t + dur);
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(gain, t + dur * 0.3);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(f).connect(g).connect(master);
        src.start(t);
        src.stop(t + dur);
      }

      function sparkle(start) {
        [2093, 2637, 3136, 4186].forEach((f, i) => tone(f, start + i * 0.06, 0.3, { gain: 0.05 }));
      }

      let lastAnswer = 0;

      return {
        unlock: ensure,
        question() {
          noise(0, 0.35, { from: 400, to: 4000, gain: 0.12 });
          [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
            tone(f, 0.15 + i * 0.07, 0.25, { type: "triangle", gain: 0.16 }));
        },
        tick(urgent) {
          tone(urgent ? 1320 : 880, 0, 0.08, { type: "square", gain: urgent ? 0.08 : 0.05 });
        },
        answer() {
          const now = performance.now();
          if (now - lastAnswer < 90) return; // a comment wave shouldn't become noise
          lastAnswer = now;
          const f = 500 + Math.random() * 400;
          tone(f, 0, 0.1, { gain: 0.12, slideTo: f * 1.8 });
        },
        winner() {
          [[523.25, 0, 0.15], [659.25, 0.1, 0.15], [783.99, 0.2, 0.15], [1046.5, 0.32, 0.7]].forEach(([f, s, d]) => {
            tone(f, s, d, { type: "triangle", gain: 0.2 });
            tone(f / 2, s, d, { type: "square", gain: 0.04 });
          });
          sparkle(0.5);
        },
        noWinner() {
          tone(392, 0, 0.25, { type: "triangle", gain: 0.15 });
          tone(349.23, 0.25, 0.25, { type: "triangle", gain: 0.15 });
          tone(293.66, 0.5, 0.6, { type: "triangle", gain: 0.15, slideTo: 250 });
        },
        leaderboard() {
          for (let i = 0; i < 16; i++) {
            noise(i * 0.045, 0.05, { from: 1800, to: 2200, gain: 0.04 + i * 0.006, q: 0.7 });
          }
          [523.25, 659.25, 783.99, 1046.5].forEach((f) => tone(f, 0.75, 0.9, { type: "triangle", gain: 0.1 }));
          sparkle(0.8);
        },
        follow() {
          [1318.5, 1760, 2093].forEach((f, i) => tone(f, i * 0.07, 0.35, { gain: 0.12 }));
        },
        gift() {
          tone(987.77, 0, 0.08, { type: "square", gain: 0.07 });
          tone(1318.5, 0.08, 0.4, { type: "square", gain: 0.07 });
          sparkle(0.2);
        },
        toast() {
          tone(740, 0, 0.1, { gain: 0.1 });
          tone(988, 0.07, 0.14, { gain: 0.1 });
        },
        nudge() {
          tone(330, 0, 0.12, { type: "triangle", gain: 0.12 });
          tone(330, 0.16, 0.12, { type: "triangle", gain: 0.12 });
        }
      };
    })();

    const unlockSound = () => Sfx.unlock();
    addEventListener("pointerdown", unlockSound);
    addEventListener("keydown", unlockSound);

    // --- Confetti / particle layer -----------------------------------------
    const fx = document.getElementById("fx");
    const fxCtx = fx.getContext("2d");
    const CONFETTI = ["#FF2E76", "#FFCB3C", "#3FE3D0", "#F4F0FF", "#9B7BFF"];
    let particles = [];
    let fxRunning = false;

    function sizeFx() {
      const dpr = window.devicePixelRatio || 1;
      fx.width = innerWidth * dpr;
      fx.height = innerHeight * dpr;
      fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener("resize", sizeFx);
    sizeFx();

    function burst(x, y, { count = 120, colors = CONFETTI, angle = -Math.PI / 2, spread = Math.PI * 2, speed = 14 } = {}) {
      if (reduceMotion) return;
      for (let i = 0; i < count; i++) {
        const a = angle + (Math.random() - 0.5) * spread;
        const v = speed * (0.4 + Math.random() * 0.8);
        particles.push({
          x, y,
          vx: Math.cos(a) * v,
          vy: Math.sin(a) * v,
          w: 8 + Math.random() * 8,
          h: 5 + Math.random() * 6,
          rot: Math.random() * Math.PI * 2,
          vr: (Math.random() - 0.5) * 0.3,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 0,
          ttl: 110 + Math.random() * 70
        });
      }
      if (!fxRunning) {
        fxRunning = true;
        requestAnimationFrame(stepFx);
      }
    }

    function burstFrom(el, opts) {
      const r = el.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, opts);
    }

    function stepFx() {
      fxCtx.clearRect(0, 0, innerWidth, innerHeight);
      particles = particles.filter((p) => p.life < p.ttl && p.y < innerHeight + 40);
      for (const p of particles) {
        p.life++;
        p.vy += 0.35;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        fxCtx.save();
        fxCtx.globalAlpha = Math.min(1, (p.ttl - p.life) / 30);
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate(p.rot);
        fxCtx.fillStyle = p.color;
        // Squash on one axis so each piece looks like it's flipping.
        const h = p.h * Math.cos(p.life * 0.2 + p.rot);
        fxCtx.fillRect(-p.w / 2, -h / 2, p.w, h);
        fxCtx.restore();
      }
      if (particles.length) {
        requestAnimationFrame(stepFx);
      } else {
        fxRunning = false;
        fxCtx.clearRect(0, 0, innerWidth, innerHeight);
      }
    }

    // Restart a CSS animation class even if it's already applied.
    function replay(el, cls) {
      el.classList.remove(cls);
      void el.offsetWidth;
      el.classList.add(cls);
    }

    // --- Countdown chip: ticks through the last 5 seconds ------------------
    let countdownTimer = null;

    function startCountdown(seconds) {
      stopCountdown();
      const end = Date.now() + seconds * 1000;
      let last = null;
      const step = () => {
        const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
        if (left !== last) {
          last = left;
          qTimer.textContent = `⏱ ${left}`;
          const urgent = left > 0 && left <= 5;
          qTimer.classList.toggle("urgent", urgent);
          timerTrack.classList.toggle("urgent", urgent);
          if (urgent) {
            replay(qTimer, "urgent");
            Sfx.tick(left <= 3);
          }
        }
        if (left > 0) countdownTimer = setTimeout(step, 100);
      };
      step();
    }

    function stopCountdown() {
      clearTimeout(countdownTimer);
      countdownTimer = null;
      qTimer.classList.remove("urgent");
      timerTrack.classList.remove("urgent");
    }

    function addAnswerBubble(nickname, count) {
      qAnswers.textContent = `✋ ${count}`;
      replay(qAnswers, "bump");
      Sfx.answer();
      if (answerFeed.childElementCount >= 8) answerFeed.firstElementChild.remove();
      const el = document.createElement("div");
      el.className = "bubble";
      el.textContent = `@${nickname} menjawab!`;
      el.style.left = `${15 + Math.random() * 70}%`;
      el.style.setProperty("--drift", `${Math.round((Math.random() - 0.5) * 80)}px`);
      answerFeed.appendChild(el);
      setTimeout(() => el.remove(), 2700);
    }

    let letters = ["A", "B", "C", "D"];

    function renderOptions(options) {
      optionsEl.innerHTML = "";
      options.forEach((opt, i) => {
        const el = document.createElement("div");
        el.className = "option enter";
        el.style.setProperty("--i", i);
        el.dataset.letter = opt.letter;
        el.innerHTML = `<div class="letter">${opt.letter}</div><div class="text">${opt.text}</div>`;
        optionsEl.appendChild(el);
      });
    }

    function runTimer(seconds) {
      timerFill.style.transition = "none";
      timerFill.style.transform = "scaleX(1)";
      // Force reflow so the transition restarts cleanly.
      void timerFill.offsetWidth;
      timerFill.style.transition = `transform ${seconds}s linear`;
      timerFill.style.transform = "scaleX(0)";
    }

    function showToast(message, isFollow, variant) {
      const el = document.createElement("div");
      el.className = "toast" + (isFollow ? " follow" : "") + (variant ? ` ${variant}` : "");
      el.textContent = message;
      toasts.appendChild(el);
      setTimeout(() => el.remove(), 5100);
    }

    function renderLeaderboard(top, title) {
      lbTitle.textContent = title || "Papan Peringkat";
      lbList.innerHTML = "";
      if (!top.length) {
        lbList.innerHTML = '<div class="row"><div class="name">Belum ada skor</div></div>';
        return;
      }
      top.forEach((v, i) => {
        const row = document.createElement("div");
        row.className = i === 0 ? "row top" : "row";
        row.style.setProperty("--i", i);
        row.innerHTML = `<div class="rank">${i + 1}</div><div class="name">${v.nickname}</div><div class="score">${v.score}</div>`;
        lbList.appendChild(row);
      });
    }

    // --- Thank-you card: one at a time, queued -----------------------------
    const thanksEl = document.getElementById("thanks");
    const thanksIcon = document.getElementById("thanksIcon");
    const thanksTitle = document.getElementById("thanksTitle");
    const thanksLine = document.getElementById("thanksLine");
    const thanksQueue = [];
    let thanksBusy = false;

    function listNames(names) {
      const at = names.map((n) => `@${n}`);
      if (at.length === 1) return at[0];
      return `${at.slice(0, -1).join(", ")} dan ${at[at.length - 1]}`;
    }

    function enqueueThanks(t) {
      // Merge a burst of follows into one card (up to 4 names) so the queue
      // doesn't lag minutes behind during a follow wave.
      const last = thanksQueue[thanksQueue.length - 1];
      if (t.kind === "follow" && last && last.kind === "follow" && last.names.length < 4) {
        if (!last.names.includes(t.nickname)) last.names.push(t.nickname);
      } else if (t.kind === "follow") {
        thanksQueue.push({ kind: "follow", names: [t.nickname] });
      } else {
        thanksQueue.push(t);
      }
      if (!thanksBusy) showNextThanks();
    }

    function showNextThanks() {
      const t = thanksQueue.shift();
      if (!t) { thanksBusy = false; return; }
      thanksBusy = true;

      thanksEl.className = t.kind;
      thanksIcon.textContent = "";
      if (t.kind === "follow") {
        thanksIcon.textContent = "💖";
        thanksTitle.textContent = "Terima kasih sudah follow!";
        thanksLine.textContent = `${listNames(t.names)} — selamat bergabung, ayo ikut jawab kuisnya!`;
      } else {
        if (t.image) {
          const img = document.createElement("img");
          img.src = t.image;
          img.alt = "";
          img.onerror = () => { thanksIcon.textContent = "🎁"; };
          thanksIcon.appendChild(img);
        } else {
          thanksIcon.textContent = "🎁";
        }
        thanksTitle.textContent = "Terima kasih atas gift-nya!";
        thanksLine.textContent = `@${t.nickname} mengirim ${t.giftName}${t.count > 1 ? ` ×${t.count}` : ""} 🙏`;
      }

      // Let the class change land before sliding in.
      requestAnimationFrame(() => requestAnimationFrame(() => thanksEl.classList.add("show")));
      if (t.kind === "follow") {
        Sfx.follow();
        setTimeout(() => burstFrom(thanksIcon, { count: 35, colors: ["#FF2E76", "#FF7AA8", "#F4F0FF"], spread: Math.PI * 0.8, speed: 12 }), 350);
      } else {
        Sfx.gift();
        setTimeout(() => burstFrom(thanksIcon, { count: 60, colors: ["#FFCB3C", "#FFE08A", "#F4F0FF"], spread: Math.PI * 0.9, speed: 15 }), 350);
      }
      const visibleMs = t.kind === "gift" ? 4500 : 3500;
      setTimeout(() => {
        thanksEl.classList.remove("show");
        setTimeout(showNextThanks, 500);
      }, visibleMs);
    }

    socket.on("thanks", enqueueThanks);

    socket.on("game:leaderboard", (top) => {
      // Silent cache for a late-joining overlay; only shown on takeover events.
      window.__lastLeaderboard = top;
    });

    socket.on("game:state", handleState);

    function handleState(payload) {
      switch (payload.type) {
        case "question": {
          leaderboardEl.classList.remove("show");
          qNumber.textContent = `Q${payload.questionNumber}`;
          qCategory.textContent = payload.category || "Trivia";
          qText.textContent = payload.question;
          qAnswers.textContent = "✋ 0";
          answerFeed.innerHTML = "";
          replay(questionCard, "enter");
          renderOptions(payload.options);
          runTimer(payload.durationSec);
          startCountdown(payload.durationSec);
          winnerBanner.className = "winner-banner none hint";
          winnerBanner.textContent = "Komentar hurufnya (A/B/C/D) untuk menjawab!";
          Sfx.question();
          break;
        }

        case "answer": {
          addAnswerBubble(payload.nickname, payload.count);
          break;
        }

        case "followAlert": {
          showToast(payload.message, true);
          Sfx.nudge();
          break;
        }

        case "reveal": {
          stopCountdown();
          qTimer.textContent = "⏱ 0";
          [...optionsEl.children].forEach((el) => {
            if (el.dataset.letter === payload.correctLetter) {
              el.classList.add("correct");
              el.classList.remove("dim");
            } else {
              el.classList.add("dim");
            }
          });
          timerFill.style.transition = "none";
          timerFill.style.transform = "scaleX(0)";
          if (payload.winner) {
            const w = payload.winner;
            winnerBanner.className = "winner-banner pop";
            winnerBanner.textContent = `🏆 @${w.nickname} menjawab ${payload.correctLetter} benar pertama kali! +${w.pointsAwarded} poin (total ${w.score})`;
            showToast(`🎉 Selamat @${w.nickname}! Kamu yang pertama menjawab benar: ${payload.correctLetter}. ${payload.correctText}`, false, "winner");
            Sfx.winner();
            burstFrom(winnerBanner, { count: 140, speed: 16 });
            // Side cannons from the bottom corners.
            setTimeout(() => {
              burst(0, innerHeight, { count: 70, angle: -Math.PI / 3, spread: 0.6, speed: 26 });
              burst(innerWidth, innerHeight, { count: 70, angle: -Math.PI * 2 / 3, spread: 0.6, speed: 26 });
            }, 250);
          } else {
            winnerBanner.className = "winner-banner none";
            winnerBanner.textContent = "Tidak ada yang benar ronde ini!";
            Sfx.noWinner();
          }
          break;
        }

        case "leaderboard": {
          stopCountdown();
          renderLeaderboard(payload.top, `Pemain teratas setelah Q${payload.afterQuestion}`);
          replay(leaderboardEl, "show");
          Sfx.leaderboard();
          setTimeout(() => burst(innerWidth / 2, innerHeight * 0.2, { count: 90, speed: 15 }), 800);
          break;
        }

        case "rank": {
          const msg = payload.found
            ? `📊 ${payload.nickname}, kamu peringkat #${payload.rank} dari ${payload.totalPlayers} dengan ${payload.score} poin!`
            : `📊 ${payload.nickname}, jawab pertanyaan dengan benar untuk masuk papan peringkat!`;
          showToast(msg, false);
          Sfx.toast();
          break;
        }
      }
    }

    // Preview without a LIVE: open overlay.html?demo to play a full round.
    if (params.has("demo")) {
      const at = (sec, fn) => setTimeout(fn, sec * 1000);
      const players = ["rizki.k", "andi.demo", "sari_22", "budi.santoso", "nadia", "ayu.m", "fajar"];
      at(0.5, () => handleState({
        type: "question", questionNumber: 1, category: "Geografi", question: "Apa ibu kota Australia?",
        options: [{ letter: "A", text: "Sydney" }, { letter: "B", text: "Melbourne" }, { letter: "C", text: "Canberra" }, { letter: "D", text: "Perth" }],
        durationSec: 12
      }));
      players.forEach((nickname, i) => at(2 + i * 0.9, () => handleState({ type: "answer", nickname, count: i + 1 })));
      at(12.5, () => handleState({ type: "reveal", correctLetter: "C", correctText: "Canberra", winner: { nickname: "rizki.k", pointsAwarded: 20, score: 60 } }));
      at(14, () => handleState({ type: "followAlert", message: "@andi.demo jawabannya benar, tapi belum follow — follow dulu supaya poinmu dihitung!" }));
      at(17, () => enqueueThanks({ kind: "follow", nickname: "sari_22" }));
      at(21.5, () => enqueueThanks({ kind: "gift", nickname: "penonton.demo", giftName: "Rose", count: 12, image: null }));
      at(28, () => handleState({
        type: "leaderboard", afterQuestion: 1,
        top: [{ nickname: "rizki.k", score: 60 }, { nickname: "nadia", score: 40 }, { nickname: "fajar", score: 20 }]
      }));
    }
  </script>
</body>
